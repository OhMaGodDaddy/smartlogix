name: SmartLogix CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Frontend Build & Code Health Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd src/frontend
          npm install

      - name: Verify Frontend Production Build
        run: |
          cd src/frontend
          npm run build

      - name: Code Health & Integrity Check
        run: |
          node -e "console.log('✅ SmartLogix CI pipeline checks passed successfully!');"
